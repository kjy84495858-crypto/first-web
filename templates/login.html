<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 오늘 뭐먹지</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        skyBrand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans KR', 'Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(14, 165, 233, 0.12)',
                        'glow': '0 0 25px -5px rgba(14, 165, 233, 0.4)',
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts (Noto Sans KR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom CSS Styles -->
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(224, 242, 254, 0.9);
        }

        .bg-grid-pattern {
            background-image: radial-gradient(rgba(14, 165, 233, 0.15) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.08); }
        }
        .animate-pulse-slow {
            animation: pulseGlow 5s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative selection:bg-skyBrand-500 selection:text-white bg-slate-50 overflow-x-hidden">

    <!-- 은은한 하늘색 원형 은하수 효과 및 격자 배경 -->
    <div class="fixed top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-gradient-to-tr from-skyBrand-300/30 to-blue-200/30 blur-3xl rounded-full pointer-events-none animate-pulse-slow"></div>
    <div class="fixed inset-0 bg-grid-pattern opacity-60 pointer-events-none"></div>

    <!-- 상단 간이 네비게이션 -->
    <header class="relative z-10 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex items-center justify-between">
        <a href="/" class="flex items-center gap-3 group">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-skyBrand-600 to-skyBrand-400 flex items-center justify-center text-white text-lg shadow-lg shadow-skyBrand-500/30 group-hover:scale-105 transition-transform duration-300">
                <i class="fa-solid fa-utensils"></i>
            </div>
            <span class="text-xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-skyBrand-800 via-skyBrand-600 to-skyBrand-500">
                오늘 뭐먹지
            </span>
        </a>
        <a href="/" class="text-xs sm:text-sm font-semibold text-slate-600 hover:text-skyBrand-600 flex items-center gap-1.5 transition-colors">
            <i class="fa-solid fa-house"></i> 메인으로
        </a>
    </header>

    <!-- 메인 로그인 카드 중앙 배치 -->
    <main class="relative z-10 my-auto py-8 px-4 sm:px-6">
        <div class="max-w-md mx-auto">
            
            <div class="glass-card rounded-3xl p-8 sm:p-10 shadow-glass relative overflow-hidden">
                
                <!-- 카드 상단 그라데이션 라인 -->
                <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-skyBrand-400 via-skyBrand-500 to-cyan-500"></div>

                <!-- 타이틀 & 아이콘 헤더 -->
                <div class="text-center mb-8">
                    <div class="w-14 h-14 bg-skyBrand-50 border border-skyBrand-200 text-skyBrand-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-sm">
                        <i class="fa-solid fa-right-to-bracket"></i>
                    </div>
                    <h1 class="text-2xl font-black text-slate-900 tracking-tight">로그인</h1>
                    <p class="text-slate-500 text-xs sm:text-sm mt-1.5">오늘 뭐먹지 서비스에 오신 것을 환영합니다!</p>
                </div>

                <!-- Flask 로그인 Form (기존 method="POST" 및 input 속성 100% 유지) -->
                <form method="POST" class="space-y-5">
                    
                    <!-- 아이디 입력란 -->
                    <div>
                        <label for="username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                            <i class="fa-regular fa-user text-skyBrand-500"></i> 아이디
                        </label>
                        <div class="relative">
                            <input type="text" 
                                   id="username" 
                                   name="username" 
                                   required 
                                   placeholder="아이디를 입력하세요" 
                                   class="w-full px-4 py-3.5 pl-11 rounded-xl bg-white border border-slate-200 focus:border-skyBrand-500 focus:ring-4 focus:ring-skyBrand-100 text-slate-800 text-sm font-medium transition-all outline-none">
                            <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                                <i class="fa-solid fa-user-tag text-sm"></i>
                            </div>
                        </div>
                    </div>

                    <!-- 비밀번호 입력란 -->
                    <div>
                        <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                            <i class="fa-solid fa-lock text-skyBrand-500"></i> 비밀번호
                        </label>
                        <div class="relative">
                            <input type="password" 
                                   id="password" 
                                   name="password" 
                                   required 
                                   placeholder="비밀번호를 입력하세요" 
                                   class="w-full px-4 py-3.5 pl-11 pr-11 rounded-xl bg-white border border-slate-200 focus:border-skyBrand-500 focus:ring-4 focus:ring-skyBrand-100 text-slate-800 text-sm font-medium transition-all outline-none">
                            <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                                <i class="fa-solid fa-key text-sm"></i>
                            </div>
                            <!-- 비밀번호 보기 / 숨기기 토글 버튼 -->
                            <button type="button" 
                                    onclick="togglePasswordVisibility()" 
                                    class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-skyBrand-600 p-1 focus:outline-none">
                                <i id="passwordToggleIcon" class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- 로그인 버튼 -->
                    <div class="pt-2">
                        <button type="submit" class="w-full py-4 rounded-xl bg-gradient-to-r from-skyBrand-600 via-skyBrand-500 to-cyan-500 hover:from-skyBrand-700 hover:to-cyan-600 text-white font-extrabold text-base shadow-lg shadow-skyBrand-500/25 hover:shadow-skyBrand-500/40 hover:-translate-y-0.5 active:translate-y-0 transition-all flex items-center justify-center gap-2">
                            <span>로그인</span>
                            <i class="fa-solid fa-arrow-right text-xs"></i>
                        </button>
                    </div>

                </form>

                <!-- 하단 회원이 아니신가요? 링크 (signup.html로 연동 수정 완료) -->
                <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                    <p class="text-xs text-slate-500">
                        아직 회원이 아니신가요? 
                        <a href="/signup.html" class="text-skyBrand-600 hover:text-skyBrand-700 font-bold underline underline-offset-4 ml-1 transition-colors">
                            회원가입 하기
                        </a>
                    </p>
                </div>

            </div>

        </div>
    </main>

    <!-- 하단 푸터 -->
    <footer class="relative z-10 py-6 text-center text-xs text-slate-400">
        © 2026 오늘 뭐먹지. All rights reserved.
    </footer>

    <!-- 비밀번호 토글 자바스크립트 -->
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('passwordToggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
